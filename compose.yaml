services:
  xiangqi-go:
    build: .
    ports:
      - "5173:5173"
    volumes:
      - account-data:/app/data
    restart: unless-stopped
    init: true
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5173
      DATABASE_PATH: /app/data/xiangqi.db
      USER_STORE_PATH: /app/data/users.json
      # 生产环境请配置高强度管理员密码并避免使用默认值 admin123
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMeSecurePassword!}
      # 若位于 Nginx 等反向代理后，请配置受信任代理 IP
      # TRUSTED_PROXIES: 127.0.0.1,::1
      # 若已启用 HTTPS，启用 Secure Cookie
      # COOKIE_SECURE: "true"

volumes:
  account-data:
